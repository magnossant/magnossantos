<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>nsfw — clone</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <button id="pink-btn" class="pink-btn" aria-label="Play">▣▨▦▤▣</button>

    <!-- controles mínimos / informação -->
    <div class="controls">
      <button id="mute-btn" class="small">🔈 Mudo</button>
      <button id="stop-btn" class="small">⏹ Parar</button>
    </div>
  </main>

  <!-- Áudio: substitua o src pelo arquivo real se necessário -->
  <audio id="bg-audio" loop preload="auto">
    <source src="konga.92cb31af.mp3" type="audio/mpeg" />
    Seu navegador não suporta áudio.
  </audio>

  <script>
    // comportamento simples: botão central toca/pausa; controles para mutar/parar
    (function () {
      const btn = document.getElementById('pink-btn');
      const audio = document.getElementById('bg-audio');
      const muteBtn = document.getElementById('mute-btn');
      const stopBtn = document.getElementById('stop-btn');

      let playing = false;

      // tentar autoplay — navegadores normalmente bloqueiam, então usamos interação
      function playAudio() {
        audio.play().catch(()=>{ /* autoplay bloqueado */ });
        playing = true;
        btn.classList.add('playing');
      }

      function pauseAudio() {
        audio.pause();
        playing = false;
        btn.classList.remove('playing');
      }

      btn.addEventListener('click', () => {
        if (!playing) playAudio(); else pauseAudio();
      });

      muteBtn.addEventListener('click', () => {
        audio.muted = !audio.muted;
        muteBtn.textContent = audio.muted ? '🔇 Mudo' : '🔈 Som';
      });

      stopBtn.addEventListener('click', () => {
        pauseAudio();
        audio.currentTime = 0;
      });

      // Atalho teclado: espaço para play/pause
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          if (!playing) playAudio(); else pauseAudio();
        }
      });

      // tentativa discreta de iniciar em dispositivos que autorizem autoplay
      window.addEventListener('load', () => {
        // pequena tentativa; se bloqueado, o usuário clica no botão
        playAudio();
      });
    })();
  </script>
</body>
</html>
